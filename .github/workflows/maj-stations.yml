name: Mise à jour des stations (OpenStreetMap)

on:
  workflow_dispatch: {}
  push:
    branches: [claude/optimistic-ramanujan-wn7v3o]
    paths: [scripts/osm_stations.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/osm_stations.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add spots-osm.json
          git diff --cached --quiet || git commit -m "Stations OpenStreetMap mises à jour"
          git push
