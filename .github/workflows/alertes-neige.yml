name: Alertes neige

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer l'état (anti-doublon)
        uses: actions/cache@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnostic du sujet ntfy (n'affiche jamais sa valeur)
        env:
          S_OK: ${{ secrets.NTFY_TOPIC != '' }}
          V_OK: ${{ vars.NTFY_TOPIC != '' }}
          TYPO: ${{ secrets.NFTY_TOPIC != '' || secrets.NTFY != '' || secrets.TOPIC != '' || secrets.NTFY_TOPIC_ != '' || vars.NFTY_TOPIC != '' || vars.NTFY != '' }}
        run: |
          echo "Secret NTFY_TOPIC (onglet Secrets, Repository secrets) : $S_OK"
          echo "Variable NTFY_TOPIC (onglet Variables) : $V_OK"
          echo "Nom approchant (NFTY_TOPIC, NTFY, TOPIC...) : $TYPO"
      - name: Vérifier la neige et notifier
        env:
          # secret de préférence ; une variable du même nom est aussi acceptée
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || vars.NTFY_TOPIC }}
        run: python scripts/check_snow.py
