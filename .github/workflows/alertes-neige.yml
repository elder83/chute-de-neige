name: Alertes neige

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurer l'état (anti-doublon)
        uses: actions/cache@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la neige et notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_snow.py
